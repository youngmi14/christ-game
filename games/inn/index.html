<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>방 있나요?</title>
  <link rel="stylesheet" href="../../shared/common.css">
  <link rel="stylesheet" href="inn.css">
</head>
<body class="inn-game">
  <div class="app">
    <header class="hud">
      <div class="timer" id="timer"><span id="time">90</span>초</div>
      <div class="gauge">
        <div class="gauge-fill" id="gaugeFill"></div>
        <div class="gauge-text" id="gaugeText">찾은 짝 0 / 6</div>
      </div>
    </header>

    <main class="field" id="field">
      <div class="board" id="board"></div>

      <!-- 짝을 다 찾으면 열리는 마지막 문: 마구간 -->
      <div class="finale" id="finale" hidden>
        <div class="tile big">
          <div class="tile-inner">
            <div class="tile-back"><span data-asset="door"></span></div>
            <div class="tile-face">
              <div class="manger">
                <span data-asset="stable"></span>
                <span class="baby" data-asset="baby"></span>
              </div>
              <span class="tile-name">아기 예수님</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <section class="overlay" id="intro">
    <div class="card">
      <h1>방 있나요?</h1>
      <p>요셉과 마리아는 베들레헴의 여관마다<br>문을 두드렸지만 방이 없었어요.</p>
      <div class="howto">
        <div class="howto-step">
          <span data-asset="door"></span><span data-asset="door"></span>
          <span class="howto-arrow">→</span>
          <span data-asset="angel"></span><span data-asset="angel"></span>
        </div>
        <p>문을 두 개씩 열어서 <b>같은 그림</b>을 찾아요.</p>
      </div>
      <p><b>90초 안에</b> 짝을 모두 찾으면 통과!</p>
      <div class="btn-row">
        <button class="btn" id="startBtn">시작하기</button>
      </div>
    </div>
  </section>

  <section class="overlay countdown" id="countdown" hidden>
    <div class="countdown-text">3</div>
  </section>

  <section class="overlay" id="result" hidden>
    <div class="card">
      <div class="result-win">
        <h1>통과!</h1>
        <div class="stamp">참<br>잘했어요</div>
        <div class="manger result-manger">
          <span data-asset="stable"></span>
          <span class="baby" data-asset="baby"></span>
        </div>
        <p>여관에는 방이 없었지만<br>아기 예수님은 <b>구유</b>에 누워 계셨어요.</p>
        <p class="verse">누가복음 2:7</p>
        <p class="stamp-guide">스탬프를 받으세요!</p>
      </div>
      <div class="result-lose">
        <h1>아쉬워요!</h1>
        <p>시간이 다 됐어요.<br><b id="pairCount">0</b>쌍을 찾았어요. 다시 도전해 볼까요?</p>
      </div>
      <div class="btn-row">
        <button class="btn" id="retryBtn">다시 하기</button>
        <a class="btn secondary" href="../../index.html">처음 화면</a>
      </div>
    </div>
  </section>

  <script src="../../shared/common.js"></script>
  <script src="inn.js"></script>
</body>
</html>
