<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>마구간 숨은그림찾기</title>
  <link rel="stylesheet" href="../../shared/common.css">
  <link rel="stylesheet" href="stable.css">
</head>
<body class="stable-game">
  <div class="app">
    <header class="hud">
      <div class="timer" id="timer"><span id="time">90</span>초</div>
      <div class="gauge">
        <div class="gauge-fill" id="gaugeFill"></div>
        <div class="gauge-text" id="gaugeText">찾은 물건 0 / 6</div>
      </div>
    </header>

    <main class="scene" id="scene">
      <div class="window"><span data-asset="moon"></span></div>
      <div class="floor"></div>

      <!-- 가운데: 구유의 아기 예수님과 가족, 동물들 (숨은 물건은 이 자리를 피해서 놓인다) -->
      <div class="holy">
        <span class="cow" data-asset="cow"></span>
        <span class="sheep" data-asset="sheep"></span>
        <span class="mary" data-asset="mary"></span>
        <span class="joseph" data-asset="joseph"></span>
        <div class="manger"><span class="baby" data-asset="baby"></span></div>
      </div>

      <div class="props" id="props"></div>
    </main>

    <footer class="wants" id="wants"></footer>
  </div>

  <section class="overlay" id="intro">
    <div class="card">
      <h1>마구간 숨은그림찾기</h1>
      <p>아기 예수님이 태어나신 마구간에<br>여러 물건이 숨어 있어요!</p>
      <div class="howto">
        <div class="howto-step">
          <span data-asset="dove"></span><span data-asset="bell"></span><span data-asset="gift"></span>
          <span class="howto-tap" data-asset="tap"></span>
        </div>
        <p>아래 목록의 물건을 그림에서 찾아 눌러요.<br>엉뚱한 곳을 누르면 <b>2초</b>가 줄어요!</p>
      </div>
      <p><b>90초 안에 6개</b>를 모두 찾으면 통과!</p>
      <div class="btn-row">
        <button class="btn" id="startBtn">시작하기</button>
      </div>
    </div>
  </section>

  <section class="overlay countdown" id="countdown" hidden>
    <div class="countdown-text">3</div>
  </section>

  <section class="overlay" id="result" hidden>
    <div class="card">
      <div class="result-win">
        <h1>통과!</h1>
        <div class="stamp">참<br>잘했어요</div>
        <div class="result-manger"><span data-asset="baby"></span></div>
        <p>목자들이 서둘러 가서<br>구유에 누운 <b>아기 예수님</b>을 찾았어요!</p>
        <p class="verse">누가복음 2:16</p>
        <p class="stamp-guide">스탬프를 받으세요!</p>
      </div>
      <div class="result-lose">
        <h1>아쉬워요!</h1>
        <p>시간이 다 됐어요.<br><b id="foundCount">0</b>개를 찾았어요. 다시 도전해 볼까요?</p>
      </div>
      <div class="btn-row">
        <button class="btn" id="retryBtn">다시 하기</button>
        <a class="btn secondary" href="../../index.html">처음 화면</a>
      </div>
    </div>
  </section>

  <script src="../../shared/common.js"></script>
  <script src="stable.js"></script>
</body>
</html>
